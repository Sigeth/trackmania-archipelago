name: release-please

# Requires repo setting: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests" (checked).
# Otherwise release-please fails with "GitHub Actions is not permitted to create
# or approve pull requests". Alternatively pass a PAT via the action's `token:`.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package plugin — Archipelago.op
        run: |
          zip -r Archipelago.op info.toml src -x '*.DS_Store'
          unzip -l Archipelago.op

      - name: Package world — trackmania_turbo.apworld
        run: |
          mkdir -p build
          rsync -a --exclude='__pycache__' --exclude='*.pyc' --exclude='test/' \
            apworld/trackmania_turbo build/
          ( cd build && zip -r -9 ../trackmania_turbo.apworld trackmania_turbo )
          unzip -l trackmania_turbo.apworld

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag }}" \
            Archipelago.op trackmania_turbo.apworld --clobber
